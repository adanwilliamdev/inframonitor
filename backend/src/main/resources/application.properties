spring.application.name=inframonitor

# Database H2 (perfil padrão - uso local via mvn/npm, sem Docker)
spring.datasource.url=jdbc:h2:mem:inframonitor
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# Logging
logging.level.com.inframonitor=DEBUG

# Scheduling
inframonitor.monitoring.interval=60000
