spring.application.name=inframonitor

# Database Postgres (perfil docker - usado pelo docker-compose)
# URL/usuario/senha vêm das variáveis de ambiente do docker-compose.yml
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console desabilitado nesse perfil (não faz sentido com Postgres)
spring.h2.console.enabled=false

# Server
server.port=8080

# Logging
logging.level.com.inframonitor=INFO

# Scheduling
inframonitor.monitoring.interval=60000
